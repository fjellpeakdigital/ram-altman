# Copy this to ram-altman.ini, next to the script or in
# %LOCALAPPDATA%\ram-altman\, and fill it in.
#
# Environment variables of the same name override anything set here.
# The RAM_ALTMAN_ prefix is optional.

TO        = sam@example.com
FROM      = you@example.com
FROM_NAME = Your Name

# Email when more than this percentage of RAM is available.
THRESHOLD = 10

# --- Pick one way to send ----------------------------------------------------

# 1. Write messages to a file and send nothing. The safest way to start.
# MAILDROP = C:\Users\you\Desktop\ram-altman-outbox.txt

# 2. SMTP. An app password, please, and not one you use anywhere else.
# SMTP_SERVER = smtp.example.com
# SMTP_PORT   = 587
# SMTP_USER   = you@example.com
# SMTP_SSL    = true
#
#    Do not write the password here. Run:
#        ram-altman.ps1 -SetPassword
#    which adds an encrypted SMTP_PASS_ENC line below, readable only by this
#    Windows account on this machine, and deletes any plaintext SMTP_PASS.

# 3. Neither: if Outlook is installed it will be used, and the mail will go
#    out through your normal account, from your normal address.
